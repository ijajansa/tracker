<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline | Bachat</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", sans-serif;
            background: linear-gradient(180deg, #f3f7ff, #e6efff);
            color: #0f172a;
        }
        .card {
            width: min(460px, calc(100% - 24px));
            padding: 28px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
            backdrop-filter: blur(18px);
        }
        h1 { margin: 0 0 12px; }
        p { color: rgba(15, 23, 42, 0.65); line-height: 1.6; }
    </style>
</head>
<body>
    <main class="card">
        <h1>You are offline</h1>
        <p>Bachat needs a connection for fresh transactions and secure session data. Please reconnect and refresh.</p>
    </main>
</body>
</html>
